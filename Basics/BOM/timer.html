<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Window Timer</title>
    <script>
        var timerId;
        function StartWindow(){

         timerId = setTimeout(function(){
                alert("Hello World");
            }, 2000);
        }

        function StopWindow(){

            clearTimeout(timerId);
        }
    </script>
</head>
<body>
    <input type="button" value="Start" onclick="StartWindow()">
    <input type="button" value="Stop" onclick="StopWindow()">
</body>
</html>
