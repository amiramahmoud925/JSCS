<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BOM Window</title>
    <script>
        var myWin;
        function openWindow(){
            myWin = window.open("childWin.html","_blank","width=400,height=400");
        }
        function closeWindow(){
            myWin.close();
        }
        function changeBackgroundColor(){
            myWin.document.body.style.backgroundColor = "lightblue";
            myWin.focus();
        }
    </script>
</head>
<body>
    <input type="button" value="Open" onclick="openWindow()">
    <input type="button" value="Close" onclick="closeWindow()">
    <input type="button" value="ChangeBgColor" onclick="changeBackgroundColor()">
</body>
</html>
