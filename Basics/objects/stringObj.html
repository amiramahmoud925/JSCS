<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Objects in JavaScript</title>
    <script>

        // String Object
        var str = String("Hello World hello world");

        console.log(str.length);
        console.log(str.charAt(8));
        console.log(str.indexOf("Wor"));
        console.log(str.lastIndexOf("wor"));

        console.log(str.substring(6, 9));
        console.log(str.split(' '));
        console.log(str.split(''));
        console.log(str.split());

        console.log(str.match(/hello/gi));
        console.log(str.replace(/hello/gi, "Hi"));


        // Array Object
        var newArr = [1,3,5,10,11,7,26];
        console.log(newArr.join("**"));
        console.log(newArr);
        console.log(newArr.pop());
        console.log(newArr);
        console.log(newArr.push("hello"));
        console.log(newArr);
        console.log(newArr.shift());
        console.log(newArr);
        console.log(newArr.unshift("abc"));
        console.log(newArr);

        var oldArr = [1,5,10,9,7,12];
        console.log(oldArr.sort(function(a,b){
            return a-b;
        }));
        
        console.log(oldArr.sort(function(a,b){
            return b-a;
        }));
        

        // Associative Array Object
        var assocArray = {
            name: "John",
            age: 30,
            city: "New York"
        };
        console.log(assocArray.name);
        console.log(assocArray.age);
        console.log(assocArray.city);

        for(i in assocArray){
            console.log(i + " : " + assocArray[i]);
        }


        // Date Object
        var date = new Date();
        console.log(date);
        console.log(date.getDay());
        console.log(date.getMonth());
        console.log(date.getFullYear());
        console.log(date.getDate());

       console.log(date.setMonth(9));
       console.log(date.setFullYear(2030));

       console.log(date.toDateString());
       console.log(date.toLocaleString());



       //Error
       var result = parseInt(prompt("enter your age between 10 to 30"));
       if(result < 10){
        throw new Error("Age is less than 10");
       }else if(result > 30){
        throw new Error("Age is greater than 30");
       }else{
        alert("done");
       }

       var myErr = new Error("Custom Error");
       throw myErr;
       console.log(myErr.message); //Custom Error
       console.log(myErr.name); //Error

       //Error Handling
       try{

        var result = parseInt(prompt("enter your age between 10 to 30"));
        if(result < 10){
         throw new Error("Age is less than 10");
        }else if(result > 30){
         throw new Error("Age is greater than 30");
        }else{
         alert("VALUE WITHIN ACCEPTED range");
        }

        console.log("inside try block");

       }catch(err){
        console.log("This is after error");
       }

       console.log("Done");


    </script>
</head>
<body>
    
</body>
</html>
